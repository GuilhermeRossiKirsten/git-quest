# Contrato do desafio — formato documentado em docs/challenge-format.md (branch main).
id: desafio-12
title: "Corrotinas que geram"
summary: "C++23: transformar um leitor de logs ansioso, que engole erros e devolve views penduradas, em generators preguiçosos (std::generator, pipelines com ranges e recursão com std::ranges::elements_of)."
track: cpp
language: cpp
standard: cpp23
toolchain: "gcc:14.2.0"
difficulty: advanced

learning_objectives:
  - "Escrever corrotinas std::generator que produzem valores sob demanda, lendo da fonte só o necessário"
  - "Garantir liberação de recursos com RAII dentro do quadro da corrotina, inclusive quando o consumidor para no meio"
  - "Propagar exceções do corpo do generator até o ponto de consumo, sem engoli-las"
  - "Controlar o tempo de vida do que é produzido (std::string_view versus valores donos do texto)"
  - "Compor generators com adaptadores de ranges (views::filter, views::take, ranges::to)"
  - "Implementar generators recursivos com std::ranges::elements_of, sem cópias e com custo por item constante"

environment:
  type: docker
  requires: [docker]
  start_command: "./start.sh"
  test_command: "./test.sh"

validation:
  type: automated
  timeout_seconds: 300

# Arquivos/pastas que o participante pode alterar. Todo o resto é do avaliador.
editable:
  - src/gq/logscan.hpp
  - src/logscan.cpp

estimated_minutes: 90
points: 300
tags: [cpp23, coroutines, std-generator, ranges, elements-of, raii, lifetime, sanitizers]
prerequisites: [desafio-4]
next: [desafio-13]
achievements: ["Mestre dos geradores"]
# Gerado com: python3 scripts/lib/gq.py checksum .   (identifica o código inicial intocado)
starter_checksum: "sha256:de020527429f0eb691a8e3b9fc722d48b50659e6a676bce1425b3a47b7a36f41"
