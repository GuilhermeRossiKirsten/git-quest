# Contrato do desafio — formato documentado em docs/challenge-format.md (branch main).
id: desafio-15
title: "Heap de prioridades"
summary: "C++17: conserte um min-heap binário indexado (decrease/increase-key, erase, desempate FIFO) que sustenta um escalonador de tarefas por prazo."
track: dsa
language: cpp
standard: cpp17
toolchain: "gcc:14.2.0"
difficulty: intermediate

learning_objectives:
  - "Manter a propriedade de heap num vetor 0-based: índices de pai e filhos, sift-up e sift-down escolhendo o menor filho"
  - "Manter um mapa chave -> posição coerente a cada troca para consultar, atualizar e remover em O(log n)"
  - "Implementar decrease-key, increase-key e remoção arbitrária restaurando o heap na direção certa"
  - "Definir e garantir uma regra de desempate estável (FIFO) numa estrutura que não é estável por natureza"
  - "Validar uma estrutura de dados com testes diferenciais contra um modelo simples e com medição de desempenho"

environment:
  type: docker
  requires: [docker]
  start_command: "./start.sh"
  test_command: "./test.sh"

validation:
  type: automated
  timeout_seconds: 300

# Arquivos/pastas que o participante pode alterar. Todo o resto é do avaliador.
editable:
  - src/indexed_min_heap.h
  - src/scheduler.h
  - src/scheduler.cpp

estimated_minutes: 50
points: 150
tags: [cpp17, heap, priority-queue, decrease-key, indexed-heap, differential-testing, performance]
prerequisites: [desafio-14]
next: [desafio-16]
achievements: ["Guardião do heap"]
