# Contrato do desafio — formato documentado em docs/challenge-format.md (branch main).
id: desafio-14
title: "Fila circular sem alocação"
summary: "Ring buffer de capacidade fixa em C++17 para um log de telemetria: corrigir cheia/vazia, wrap-around e tempo de vida dos elementos, sem usar o heap."
track: dsa
language: cpp
standard: cpp17
toolchain: "gcc:14.2.0"
difficulty: beginner

learning_objectives:
  - "Distinguir fila cheia de fila vazia num buffer circular sem desperdiçar um lugar"
  - "Calcular posições com aritmética modular correta (wrap-around) a partir do elemento mais antigo"
  - "Guardar N elementos dentro do próprio objeto, sem alocação dinâmica"
  - "Controlar o tempo de vida dos elementos: construir só ao inserir e destruir ao remover"
  - "Validar uma estrutura de dados com testes de borda e teste diferencial contra std::deque"

environment:
  type: docker
  requires: [docker]
  start_command: "./start.sh"
  test_command: "./test.sh"

validation:
  type: automated
  timeout_seconds: 300

# Arquivos/pastas que o participante pode alterar. Todo o resto é do avaliador.
editable:
  - src/ring_buffer.h

estimated_minutes: 40
points: 100
tags: [cpp17, ring-buffer, circular-buffer, queue, std-optional, no-heap, embedded, differential-testing]
prerequisites: []
next: [desafio-15]
achievements: ["Senhor dos anéis"]
