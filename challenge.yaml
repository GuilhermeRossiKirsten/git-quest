# Contrato do desafio — formato documentado em docs/challenge-format.md (branch main).
id: desafio-28
title: "O switch que crescia"
summary: "C++ Software Design: trocar o enum + switch espalhado (e a hierarquia que fatia) de um motor de promoções por type erasure com concept, para que parceiros pluguem tipos novos sem editar o núcleo — mantendo as saídas e a semântica de valor."
track: cpp
language: cpp
standard: cpp20
toolchain: "gcc:14.2.0"
difficulty: intermediate

learning_objectives:
  - "Reconhecer o custo de enum + switch e de dynamic_cast em cascata espalhados pelo código (violação do princípio aberto/fechado)"
  - "Diagnosticar fatiamento e cópias que perdem o tipo em hierarquias copiadas por valor"
  - "Implementar Type Erasure (External Polymorphism + Bridge + Prototype) para aceitar tipos novos sem herança e sem editar o núcleo"
  - "Expressar o contrato de uma regra com um concept C++20 e rejeitar tipos inválidos em tempo de compilação"
  - "Preservar semântica de valor: cópias independentes, movimento noexcept sem alocação e nenhum vazamento"
  - "Comparar Type Erasure, hierarquia virtual e std::variant quanto ao que cada um deixa aberto: tipos ou operações"

environment:
  type: docker
  requires: [docker]
  start_command: "./start.sh"
  test_command: "./test.sh"

validation:
  type: automated
  timeout_seconds: 300

# Arquivos/pastas que o participante pode alterar. Todo o resto é do avaliador.
editable:
  - src/promo
  - src/main.cpp

estimated_minutes: 60
points: 200
tags: [cpp20, software-design, type-erasure, strategy, value-semantics, concepts, open-closed, slicing]
prerequisites: [desafio-11]
next: [desafio-29]
achievements: ["Domador de Switches"]
