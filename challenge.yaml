# Contrato do desafio — formato documentado em docs/challenge-format.md (branch main).
id: desafio-16
title: "O caminho mais curto"
summary: "C++17: consertar BFS, Dijkstra e Union-Find de um planejador de rotas de entrega que erra rotas, estoura inteiros e trava em mapas grandes."
track: dsa
language: cpp
standard: cpp17
toolchain: "gcc:14.2.0"
difficulty: advanced

learning_objectives:
  - "Distinguir BFS (fila) de DFS (pilha) e usar BFS para o menor número de arestas"
  - "Implementar Dijkstra corretamente: um vértice só é definitivo quando sai da fila de prioridade, e entradas obsoletas são descartadas"
  - "Escolher tipos que comportam a soma dos custos (int64) e tratar src == dst e destino inalcançável com std::optional"
  - "Reconstruir o caminho a partir dos predecessores, na ordem certa e incluindo a origem"
  - "Implementar Union-Find com compressão de caminho e união por tamanho/posto, sem recursão proporcional à altura"
  - "Validar algoritmos de grafos com testes diferenciais contra uma referência e com testes de desempenho adversariais"

environment:
  type: docker
  requires: [docker]
  start_command: "./start.sh"
  test_command: "./test.sh"

validation:
  type: automated
  timeout_seconds: 300

# Arquivos/pastas que o participante pode alterar. Todo o resto é do avaliador.
editable:
  - src/route_planner.h
  - src/route_planner.cpp
  - src/disjoint_set.h
  - src/disjoint_set.cpp

estimated_minutes: 75
points: 250
tags: [cpp17, graphs, bfs, dijkstra, priority-queue, union-find, overflow, performance, sanitizers]
prerequisites: [desafio-15]
next: []
achievements: ["Cartógrafo das rotas"]
