# Contrato do desafio — formato documentado em docs/challenge-format.md (branch main).
id: desafio-2
title: "Lambdas sem fronteiras"
summary: "Modernizar para C++14 uma biblioteca header-only de utilitários funcionais cujas closures guardam referências mortas, compartilham estado, copiam demais e só funcionam para int."
track: cpp
language: cpp
standard: cpp14
toolchain: "gcc:14.2.0"
difficulty: intermediate

learning_objectives:
  - "Escrever lambdas genéricas (parâmetros auto) que funcionam com tipos diferentes sem duplicar functors"
  - "Usar init capture para mover objetos move-only (std::unique_ptr) para dentro de closures"
  - "Evitar modos de captura padrão e referências pendentes em closures que sobrevivem ao escopo"
  - "Encaminhar argumentos com auto&& e std::forward<decltype(x)> sem cópias desnecessárias"
  - "Usar dedução de tipo de retorno (auto) no lugar de std::function quando o tipo exato importa"
  - "Definir variable templates com type traits em C++14 estrito, sem recursos de C++17"

environment:
  type: docker
  requires: [docker]
  start_command: "./start.sh"
  test_command: "./test.sh"

validation:
  type: automated
  timeout_seconds: 300

# Arquivos/pastas que o participante pode alterar. Todo o resto é do avaliador.
editable:
  - src

estimated_minutes: 45
points: 150
tags: [cpp14, lambdas, generic-lambdas, init-capture, perfect-forwarding, variable-templates, sanitizers]
prerequisites: [desafio-1]
next: [desafio-4]
achievements: ["Domador de closures"]
starter_checksum: "sha256:2afa693fc4805d2c5e3cce4e7af4e39239a15ab31cb1b739d8b84219b89a54b3"
