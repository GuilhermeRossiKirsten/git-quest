# Contrato do desafio — formato documentado em docs/challenge-format.md (branch main).
id: desafio-6
title: "A tabela que esquecia"
summary: "Conserte uma hash table com endereçamento aberto que perde chaves após remoções, estoura o fator de carga e trava com chaves de bits baixos iguais; validada contra std::unordered_map, por invariantes e por desempenho."
track: dsa
language: cpp
standard: cpp17
toolchain: "gcc:14.2.0"
difficulty: intermediate

learning_objectives:
  - "Implementar remoção em endereçamento aberto sem quebrar buscas (lápides ou backward-shift deletion)"
  - "Manter size, lápides e fator de carga coerentes em inserção, sobrescrita, remoção e rehash"
  - "Escolher quando e para qual capacidade fazer rehash, garantindo término das buscas e O(1) amortizado"
  - "Reconhecer clusters causados por hash & (capacidade - 1) e aplicar mistura de bits"
  - "Validar estruturas de dados com teste diferencial, invariantes, sanitizers e teste de desempenho separado"

environment:
  type: docker
  requires: [docker]
  start_command: "./start.sh"
  test_command: "./test.sh"

validation:
  type: automated
  timeout_seconds: 300

# Arquivos/pastas que o participante pode alterar. Todo o resto é do avaliador.
editable:
  - src

estimated_minutes: 75
points: 200
tags: [cpp, cpp17, hash-table, open-addressing, linear-probing, tombstones, load-factor, differential-testing, sanitizers, performance]
prerequisites: []
next: [desafio-7]
achievements: ["Guardião das Lápides"]
