apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  labels:
    app: inventory-api
    app.kubernetes.io/part-of: gitquest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
        app.kubernetes.io/part-of: gitquest
    spec:
      containers:
        - name: api
          image: gitquest/inventory-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: inventory-api-config
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            periodSeconds: 5
