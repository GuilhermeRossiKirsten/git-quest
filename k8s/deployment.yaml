# catalog-api em produção. Último incidente: o deploy da 2.0.0 tirou o catálogo
# do ar e o rollback não funcionou (veja o README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/part-of: gitquest
spec:
  replicas: 1
  # "Para não acumular ReplicaSets velhos no cluster."
  revisionHistoryLimit: 0
  # "Deploy às vezes demora; melhor não dar timeout."
  progressDeadlineSeconds: 3600
  # "Troca tudo de uma vez: o deploy fica mais rápido."
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
        app.kubernetes.io/part-of: gitquest
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: gitquest/catalog-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
