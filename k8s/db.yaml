# "Banco de dados" de pedidos (um servidor TCP simples na porta 5432).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: shop
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: db
          image: gitquest/desafio-25-shop:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["db"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          ports:
            - name: db
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: db
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: db
      port: 5432
      targetPort: db
