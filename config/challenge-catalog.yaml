# Catálogo de desafios do GitQuest.
#
# Fonte da verdade da LISTA de desafios. Os detalhes (objetivos, ambiente,
# arquivos editáveis) ficam no challenge.yaml de cada branch desafio-N.
# Formato: subconjunto de YAML descrito em docs/challenge-format.md.
#
# status: available -> a branch existe e passa na CI
#         planned   -> reservado no roteiro, ainda sem branch

challenges:
  # --- Trilha C++ ------------------------------------------------------------
  - id: desafio-1
    title: "O vazamento silencioso"
    track: cpp
    difficulty: beginner
    points: 100
    estimated_minutes: 45
    status: available
    prerequisites: []
    summary: "C++11: RAII, std::unique_ptr e a regra dos três/cinco num gerenciador de sessões legado que vaza memória."

  - id: desafio-2
    title: "Lambdas sem fronteiras"
    track: cpp
    difficulty: intermediate
    points: 150
    estimated_minutes: 45
    status: available
    prerequisites: [desafio-1]
    summary: "C++14: generic lambdas, init capture, dedução de tipo de retorno e std::make_unique numa biblioteca de utilitários funcionais."

  - id: desafio-3
    title: "O valor que não estava lá"
    track: cpp
    difficulty: intermediate
    points: 150
    estimated_minutes: 50
    status: available
    prerequisites: [desafio-1]
    summary: "C++17: std::optional, std::string_view e std::variant substituindo valores sentinela e ponteiros pendurados num parser de configuração."

  - id: desafio-4
    title: "Contratos de template"
    track: cpp
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-2]
    summary: "C++20: concepts e constraints para que templates rejeitem tipos inválidos com erros claros em vez de comportamento errado."

  - id: desafio-5
    title: "Erros que não se escondem"
    track: cpp
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-3, desafio-4]
    summary: "C++23: std::expected e adaptadores de ranges para um analisador de logs que trata erros explicitamente."

  # --- Trilha Estruturas de Dados --------------------------------------------
  - id: desafio-6
    title: "A tabela que esquecia"
    track: dsa
    difficulty: intermediate
    points: 200
    estimated_minutes: 75
    status: available
    prerequisites: []
    summary: "Hash table com endereçamento aberto: tombstones, rehash e fator de carga, validada contra std::unordered_map e por desempenho."

  # --- Trilha Go -------------------------------------------------------------
  - id: desafio-7
    title: "O pool que transbordou"
    track: go
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: []
    summary: "Go: worker pool com concorrência limitada, ordem preservada, sem data races (go test -race) e sem vazamento de goroutines."

  - id: desafio-8
    title: "A requisição que não sabia parar"
    track: go
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-7]
    summary: "Go: context cancellation, deadlines e retry com backoff num cliente HTTP que hoje ignora cancelamentos."

  # --- Trilha Docker e Kubernetes --------------------------------------------
  - id: desafio-9
    title: "A imagem de um gigabyte"
    track: docker
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: []
    summary: "Docker: multi-stage build, usuário não-root, health check e nenhum segredo dentro da imagem."

  - id: desafio-10
    title: "O Deployment que nunca ficou pronto"
    track: kubernetes
    difficulty: advanced
    points: 300
    estimated_minutes: 90
    status: available
    prerequisites: [desafio-9]
    summary: "Kubernetes (Kind): diagnosticar e corrigir um Deployment com falhas de imagem, configuração, probes, recursos e Service."

  # --- Segunda leva -----------------------------------------------------------
  - id: desafio-11
    title: "Move semantics sem cópias escondidas"
    track: cpp
    difficulty: intermediate
    points: 150
    estimated_minutes: 45
    status: available
    prerequisites: [desafio-1]
    summary: "C++11: rvalue references, std::move e contagem de cópias num buffer de mensagens."

  - id: desafio-12
    title: "Corrotinas que geram"
    track: cpp
    difficulty: advanced
    points: 300
    estimated_minutes: 90
    status: available
    prerequisites: [desafio-4]
    summary: "C++20/23: coroutines e std::generator num leitor de arquivos preguiçoso."

  - id: desafio-13
    title: "jthread e stop tokens"
    track: cpp
    difficulty: advanced
    points: 250
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-4]
    summary: "C++20: std::jthread e std::stop_token para encerramento cooperativo de threads."

  - id: desafio-14
    title: "Fila circular sem alocação"
    track: dsa
    difficulty: beginner
    points: 100
    estimated_minutes: 40
    status: available
    prerequisites: []
    summary: "Ring buffer de capacidade fixa com testes de borda (cheia/vazia/wrap-around)."

  - id: desafio-15
    title: "Heap de prioridades"
    track: dsa
    difficulty: intermediate
    points: 150
    estimated_minutes: 50
    status: available
    prerequisites: [desafio-14]
    summary: "Binary heap com decrease-key, usado por um escalonador de tarefas."

  - id: desafio-16
    title: "O caminho mais curto"
    track: dsa
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-15]
    summary: "Grafos: BFS, Dijkstra e Union-Find com testes de desempenho."

  - id: desafio-17
    title: "Desligamento gracioso"
    track: go
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-8]
    summary: "Go: servidor HTTP com middleware e graceful shutdown via sinais."

  - id: desafio-18
    title: "Probes que mentem"
    track: kubernetes
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-10]
    summary: "Kubernetes: liveness vs readiness vs startup probes num serviço de inicialização lenta."

  - id: desafio-19
    title: "Rollout e rollback"
    track: kubernetes
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-10]
    summary: "Kubernetes: estratégias de rolling update, maxSurge/maxUnavailable e rollback de uma versão defeituosa."

  - id: desafio-20
    title: "O consumidor que processava duas vezes"
    track: database
    difficulty: advanced
    points: 300
    estimated_minutes: 90
    status: available
    prerequisites: [desafio-9]
    summary: "Arquitetura: idempotência de consumidores e outbox pattern com PostgreSQL."

  # --- Terceira leva ----------------------------------------------------------
  - id: desafio-21
    title: "O processo que não morria"
    track: linux
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: []
    summary: "Linux: fork/exec, sinais, processos zumbis, pipes e file descriptors herdados num supervisor de processos."

  - id: desafio-22
    title: "Mensagens pela metade"
    track: network
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: []
    summary: "Redes: framing de mensagens sobre TCP (length-prefix), leituras parciais, timeouts e backpressure."

  - id: desafio-23
    title: "A consulta que varria a tabela"
    track: database
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: []
    summary: "SQL: índices, EXPLAIN ANALYZE e paginação por keyset no PostgreSQL."

  - id: desafio-24
    title: "O cache que mentia"
    track: database
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-23]
    summary: "Redis: cache-aside, invalidação, stampede e TTL com jitter."

  - id: desafio-25
    title: "Quem pode o quê"
    track: kubernetes
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-19]
    summary: "Kubernetes: RBAC de menor privilégio e NetworkPolicy deny-by-default."

  # --- Quarta leva (baseada nos livros de Livros/) ---------------------------
  - id: desafio-26
    title: "A arena que não devolvia"
    track: cpp
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-11]
    summary: "C++17/20: std::pmr, memory resources, alinhamento e arenas num parser que aloca demais."

  - id: desafio-27
    title: "Só compila na minha máquina"
    track: cpp
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-1]
    summary: "CMake moderno: targets, PUBLIC/PRIVATE/INTERFACE, install/export e find_package num projeto que só compila no diretório do autor."

  - id: desafio-28
    title: "O switch que crescia"
    track: cpp
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-11]
    summary: "C++ Software Design: trocar um switch por tipo que cresce a cada feature por type erasure/strategy, sem slicing e sem quebrar o comportamento."

  - id: desafio-29
    title: "Metros mais segundos"
    track: cpp
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-4]
    summary: "Template metaprogramming: sistema de unidades em tempo de compilação em que somar metros com segundos não compila."

  - id: desafio-30
    title: "Dados que não cabiam no cache"
    track: performance
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-14]
    summary: "Desempenho: localidade de cache, AoS x SoA e padrões de acesso medidos de forma determinística com cachegrind."

  - id: desafio-31
    title: "A precedência esquecida"
    track: compilers
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: []
    summary: "Compiladores: lexer e parser descendente recursivo com precedência, associatividade, unários e erros com posição."

  - id: desafio-32
    title: "O pacote que derrubava o coletor"
    track: security
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-21]
    summary: "Programação defensiva em C: validação de comprimentos, overflow de inteiros em cálculos de tamanho e limites de buffer, verificados com ASan e fuzzing determinístico."

  - id: desafio-33
    title: "A fila sem trava que travava"
    track: cpp
    difficulty: advanced
    points: 300
    estimated_minutes: 90
    status: available
    prerequisites: [desafio-13, desafio-14]
    summary: "Baixa latência: fila SPSC lock-free com memory orders corretos, sem false sharing, validada com TSan e estresse."

  - id: desafio-34
    title: "A API que quebrava os clientes"
    track: architecture
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-17]
    summary: "Design de APIs: paginação, ETag e If-Match contra lost updates, Idempotency-Key, erros problem+json e compatibilidade com clientes antigos."

  - id: desafio-35
    title: "Relógios que discordavam"
    track: distributed
    difficulty: advanced
    points: 250
    estimated_minutes: 75
    status: available
    prerequisites: [desafio-22]
    summary: "Sistemas distribuídos: relógios de Lamport e vetoriais, ordem causal e convergência num KV replicado com rede simulada."

  - id: desafio-36
    title: "O pedido que aceitava tudo"
    track: architecture
    difficulty: intermediate
    points: 200
    estimated_minutes: 60
    status: available
    prerequisites: [desafio-34]
    summary: "DDD: agregados que protegem invariantes, value objects e eventos de domínio num modelo anêmico."
